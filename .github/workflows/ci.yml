# CI khung cho CENTER-V1 — build + test + quét bảo mật (rules/80, rules/70).
# Job sẽ kích hoạt đầy đủ khi các module được hiện thực theo docs/PLAN.md.
name: CI

on:
  push:
    branches: [main, sub1]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('services/**/pom.xml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        working-directory: services
        run: mvn -q --batch-mode clean verify

  web:
    name: Web (Node)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm test

  security:
    name: Security scan (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
      - name: Trivy (SCA / filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
        continue-on-error: true
